dle" font-size="10" fill="#cfddf1" font-family="Arial,sans-serif">Contesta</text><path d="M1360,-147.5 C1430,-147.5 1370,-32.5 1440,-32.5" fill="none" stroke="#7a94b6" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="1358" y="-114" width="84" height="20" rx="10" fill="#18263c"/><text x="1400" y="-100" text-anchor="middle" font-size="10" fill="#cfddf1" font-family="Arial,sans-serif">Continua</text><path d="M1360,158 C1430,158 1370,-32.5 1440,-32.5" fill="none" stroke="#7a94b6" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="1358" y="38.75" width="84" height="20" rx="10" fill="#18263c"/><text x="1400" y="52.75" text-anchor="middle" font-size="10" fill="#cfddf1" font-family="Arial,sans-serif">Exemplifica</text><path d="M1580,50 C1655,140 1505,90 1580,180" fill="none" stroke="#7a94b6" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="1538" y="91" width="84" height="20" rx="10" fill="#18263c"/><text x="1580" y="105" text-anchor="middle" font-size="10" fill="#cfddf1" font-family="Arial,sans-serif">Reformula</text><path d="M1720,253 C1790,253 1730,47.5 1800,47.5" fill="none" stroke="#7a94b6" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="1718" y="126.25" width="84" height="20" rx="10" fill="#18263c"/><text x="1760" y="140.25" text-anchor="middle" font-size="10" fill="#cfddf1" font-family="Arial,sans-serif">Apoia</text><path d="M1940,130 C2015,220 65,-90 140,0" fill="none" stroke="#7a94b6" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="998" y="41" width="84" height="20" rx="10" fill="#18263c"/><text x="1040" y="55" text-anchor="middle" font-size="10" fill="#cfddf1" font-family="Arial,sans-serif">Retorna a</text><path d="M2080,47.5 C2150,47.5 2090,56.5 2160,56.5" fill="none" stroke="#7a94b6" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="2078" y="28" width="84" height="20" rx="10" fill="#18263c"/><text x="2120" y="42" text-anchor="middle" font-size="10" fill="#cfddf1" font-family="Arial,sans-serif">Continua</text><rect x="0" y="0" width="280" height="165" rx="16" fill="#182337" stroke="#70b9ff" stroke-width="2"/><rect x="1" y="1" width="278" height="7" rx="3" fill="#70b9ff"/><text x="15" y="30" fill="#70b9ff" font-size="11" font-family="Arial,sans-serif" font-weight="bold">PERGUNTA</text><text x="15" y="52" fill="#f3f6fd" font-size="15" font-weight="bold" font-family="Arial,sans-serif">Pergunta principal</text><text x="15" y="77" fill="#d8e0ef" font-size="13" font-family="Arial,sans-serif">O que significa dizer que algo não me</text><text x="15" y="96" fill="#d8e0ef" font-size="13" font-family="Arial,sans-serif">afeta se eu desconheço sua</text><text x="15" y="115" fill="#d8e0ef" font-size="13" font-family="Arial,sans-serif">existência?</text><text x="15" y="150" fill="#aabbd7" font-size="11" font-family="Arial,sans-serif">Eu inicial • Ativo</text><rect x="360" y="-160" width="280" height="165" rx="16" fill="#182337" stroke="#bca8ff" stroke-width="2"/><rect x="361" y="-159" width="278" height="7" rx="3" fill="#bca8ff"/><text x="375" y="-130" fill="#bca8ff" font-size="11" font-family="Arial,sans-serif" font-weight="bold">PREMISSA</text><text x="375" y="-108" fill="#f3f6fd" font-size="15" font-weight="bold" font-family="Arial,sans-serif">Sofrimento consciente</text><text x="375" y="-83" fill="#d8e0ef" font-size="13" font-family="Arial,sans-serif">Se desconheço um acontecimento, não</text><text x="375" y="-64" fill="#d8e0ef" font-size="13" font-family="Arial,sans-serif">posso sofrer conscientemente por ele</text><text x="375" y="-45" fill="#d8e0ef" font-size="13" font-family="Arial,sans-serif">naquele instante.</text><text x="375" y="-10" fill="#aabbd7" font-size="11" font-family="Arial,sans-serif">Eu inicial • Ativo</text><rect x="720" y="-210" width="280" height="165" rx="16" fill="#182337" stroke="#fa9b8c" stroke-width="2"/><rect x="721" y="-209" width="278" height="7" rx="3" fill="#fa9b8c"/><text x="735" y="-180" fill="#fa9b8c" font-size="11" font-family="Arial,sans-serif" font-weight="bold">OBJEÇÃO</text><text x="735" y="-158" fill="#f3f6fd" font-size="15" font-weight="bold" font-family="Arial,sans-serif">E as consequências?</text><text x="735" y="-133" fill="#d8e0ef" font-size="13" font-family="Arial,sans-serif">Não perceber algo elimina as</text><text x="735" y="-114" fill="#d8e0ef" font-size="13" font-family="Arial,sans-serif">consequências que isso pode produzir</text><text x="735" y="-95" fill="#d8e0ef" font-size="13" font-family="Arial,sans-serif">na minha vida?</text><text x="735" y="-60" fill="#aabbd7" font-size="11" font-family="Arial,sans-serif">Eu crítico • Ativo</text><rect x="1080" y="-230" width="280" height="165" rx="16" fill="#182337" stroke="#8dc9d2" stroke-width="2"/><rect x="1081" y="-229" width="278" height="7" rx="3" fill="#8dc9d2"/><text x="1095" y="-200" fill="#8dc9d2" font-size="11" font-family="Arial,sans-serif" font-weight="bold">CONTRA-ARGUMENTO</text><text x="1095" y="-178" fill="#f3f6fd" font-size="15" font-weight="bold" font-family="Arial,sans-serif">Duas dimensões</text><text x="1095" y="-153" fill="#d8e0ef" font-size="13" font-family="Arial,sans-serif">Ausência de sofrimento imediato não</text><text x="1095" y="-134" fill="#d8e0ef" font-size="13" font-family="Arial,sans-serif">significa ausência de efeitos</text><text x="1095" y="-115" fill="#d8e0ef" font-size="13" font-family="Arial,sans-serif">concretos.</text><text x="1095" y="-80" fill="#aabbd7" font-size="11" font-family="Arial,sans-serif">Eu inicial • Ativo</text><rect x="720" y="65" width="280" height="165" rx="16" fill="#182337" stroke="#ce9de6" stroke-width="2"/><rect x="721" y="66" width="278" height="7" rx="3" fill="#ce9de6"/><text x="735" y="95" fill="#ce9de6" font-size="11" font-family="Arial,sans-serif" font-weight="bold">CENÁRIO</text><text x="735" y="117" fill="#f3f6fd" font-size="15" font-weight="bold" font-family="Arial,sans-serif">Cenário A</text><text x="735" y="142" fill="#d8e0ef" font-size="13" font-family="Arial,sans-serif">Uma pessoa esconde um fato sem</text><text x="735" y="161" fill="#d8e0ef" font-size="13" font-family="Arial,sans-serif">alterar em nada minhas decisões ou</text><text x="735" y="180" fill="#d8e0ef" font-size="13" font-family="Arial,sans-serif">meu cotidiano.</text><text x="735" y="215" fill="#aabbd7" font-size="11" font-family="Arial,sans-serif">Eu inicial • Ativo</text><rect x="1080" y="85" width="280" height="146" rx="16" fill="#182337" stroke="#ce9de6" stroke-width="2"/><rect x="1081" y="86" width="278" height="7" rx="3" fill="#ce9de6"/><text x="1095" y="115" fill="#ce9de6" font-size="11" font-family="Arial,sans-serif" font-weight="bold">CENÁRIO</text><text x="1095" y="137" fill="#f3f6fd" font-size="15" font-weight="bold" font-family="Arial,sans-serif">Cenário B</text><text x="1095" y="162" fill="#d8e0ef" font-size="13" font-family="Arial,sans-serif">Uma informação omitida me impede de</text><text x="1095" y="181" fill="#d8e0ef" font-size="13" font-family="Arial,sans-serif">fazer escolhas importantes.</text><text x="1095" y="216" fill="#aabbd7" font-size="11" font-family="Arial,sans-serif">Eu crítico • Ativo</text><rect x="1440" y="-115" width="280" height="165" rx="16" fill="#182337" stroke="#70b9ff" stroke-width="2"/><rect x="1441" y="-114" width="278" height="7" rx="3" fill="#70b9ff"/><text x="1455" y="-85" fill="#70b9ff" font-size="11" font-family="Arial,sans-serif" font-weight="bold">PERGUNTA</text><text x="1455" y="-63" fill="#f3f6fd" font-size="15" font-weight="bold" font-family="Arial,sans-serif">O que é ser afetado?</text><text x="1455" y="-38" fill="#d8e0ef" font-size="13" font-family="Arial,sans-serif">Estou falando de sentir algo, de</text><text x="1455" y="-19" fill="#d8e0ef" font-size="13" font-family="Arial,sans-serif">perder autonomia ou de sofrer</text><text x="1455" y="0" fill="#d8e0ef" font-size="13" font-family="Arial,sans-serif">consequências?</text><text x="1455" y="35" fill="#aabbd7" font-size="11" font-family="Arial,sans-serif">Observador • Ativo</text><rect x="1440" y="180" width="280" height="146" rx="16" fill="#182337" stroke="#f1d07f" stroke-width="2"/><rect x="1441" y="181" width="278" height="7" rx="3" fill="#f1d07f"/><text x="1455" y="210" fill="#f1d07f" font-size="11" font-family="Arial,sans-serif" font-weight="bold">VALOR PESSOAL</text><text x="1455" y="232" fill="#f3f6fd" font-size="15" font-weight="bold" font-family="Arial,sans-serif">Autonomia</text><text x="1455" y="257" fill="#d8e0ef" font-size="13" font-family="Arial,sans-serif">Valorizar a possibilidade de escolher</text><text x="1455" y="276" fill="#d8e0ef" font-size="13" font-family="Arial,sans-serif">com base em informações relevantes.</text><text x="1455" y="311" fill="#aabbd7" font-size="11" font-family="Arial,sans-serif">Eu inicial • Ativo</text><rect x="1800" y="-35" width="280" height="165" rx="16" fill="#182337" stroke="#9eaff7" stroke-width="2"/><rect x="1801" y="-34" width="278" height="7" rx="3" fill="#9eaff7"/><text x="1815" y="-5" fill="#9eaff7" font-size="11" font-family="Arial,sans-serif" font-weight="bold">RETORNO AO TEMA</text><text x="1815" y="17" fill="#f3f6fd" font-size="15" font-weight="bold" font-family="Arial,sans-serif">Voltar ao centro</text><text x="1815" y="42" fill="#d8e0ef" font-size="13" font-family="Arial,sans-serif">Agora volto à pergunta original,</text><text x="1815" y="61" fill="#d8e0ef" font-size="13" font-family="Arial,sans-serif">distinguindo o que sinto do que</text><text x="1815" y="80" fill="#d8e0ef" font-size="13" font-family="Arial,sans-serif">realmente acontece.</text><text x="1815" y="115" fill="#aabbd7" font-size="11" font-family="Arial,sans-serif">Observador • Ativo</text><rect x="2160" y="-45" width="280" height="203" rx="16" fill="#182337" stroke="#d1b06e" stroke-width="2"/><rect x="2161" y="-44" width="278" height="7" rx="3" fill="#d1b06e"/><text x="2175" y="-15" fill="#d1b06e" font-size="11" font-family="Arial,sans-serif" font-weight="bold">CONCLUSÃO PROVISÓRIA</text><text x="2175" y="7" fill="#f3f6fd" font-size="15" font-weight="bold" font-family="Arial,sans-serif">Conclusão provisória</text><text x="2175" y="32" fill="#d8e0ef" font-size="13" font-family="Arial,sans-serif">Não saber pode impedir sofrimento</text><text x="2175" y="51" fill="#d8e0ef" font-size="13" font-family="Arial,sans-serif">consciente imediato, mas não garante</text><text x="2175" y="70" fill="#d8e0ef" font-size="13" font-family="Arial,sans-serif">ausência de consequências, nem</text><text x="2175" y="89" fill="#d8e0ef" font-size="13" font-family="Arial,sans-serif">preserva necessariamente minha</text><text x="2175" y="108" fill="#d8e0ef" font-size="13" font-family="Arial,sans-serif">autonomia.</text><text x="2175" y="143" fill="#aabbd7" font-size="11" font-family="Arial,sans-serif">Eu inicial • Ativo</text></svg>