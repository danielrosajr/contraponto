84.5 255,504.5 325,504.5" fill="none" stroke="#7a94b6" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="260.5" y="270.5" width="84" height="20" rx="10" fill="#18263c"/><text x="302.5" y="284.5" text-anchor="middle" font-size="10" fill="#cfddf1" font-family="Arial,sans-serif">Continua</text><path d="M605,504.5 C675,504.5 630,524.5 700,524.5" fill="none" stroke="#7a94b6" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="610.5" y="490.5" width="84" height="20" rx="10" fill="#18263c"/><text x="652.5" y="504.5" text-anchor="middle" font-size="10" fill="#cfddf1" font-family="Arial,sans-serif">Continua</text><path d="M980,524.5 C1050,524.5 1020,544.5 1090,544.5" fill="none" stroke="#7a94b6" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="993" y="510.5" width="84" height="20" rx="10" fill="#18263c"/><text x="1035" y="524.5" text-anchor="middle" font-size="10" fill="#cfddf1" font-family="Arial,sans-serif">Continua</text><path d="M1370,544.5 C1440,544.5 1410,555 1480,555" fill="none" stroke="#7a94b6" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="1383" y="525.75" width="84" height="20" rx="10" fill="#18263c"/><text x="1425" y="539.75" text-anchor="middle" font-size="10" fill="#cfddf1" font-family="Arial,sans-serif">Continua</text><path d="M1760,555 C1830,555 1790,534.5 1860,534.5" fill="none" stroke="#7a94b6" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="1768" y="520.75" width="84" height="20" rx="10" fill="#18263c"/><text x="1810" y="534.75" text-anchor="middle" font-size="10" fill="#cfddf1" font-family="Arial,sans-serif">Continua</text><rect x="0" y="0" width="280" height="169" rx="16" fill="#182337" stroke="#70b9ff" stroke-width="2"/><rect x="1" y="1" width="278" height="7" rx="3" fill="#70b9ff"/><text x="15" y="30" fill="#70b9ff" font-size="11" font-family="Arial,sans-serif" font-weight="bold">PERGUNTA</text><text x="15" y="52" fill="#f3f6fd" font-size="15" font-weight="bold" font-family="Arial,sans-serif">Pergunta principal</text><text x="15" y="77" fill="#d8e0ef" font-size="13" font-family="Arial,sans-serif">O que significa dizer que algo não me</text><text x="15" y="96" fill="#d8e0ef" font-size="13" font-family="Arial,sans-serif">afeta se eu desconheço sua</text><text x="15" y="115" fill="#d8e0ef" font-size="13" font-family="Arial,sans-serif">existência?</text><text x="15" y="154" fill="#aabbd7" font-size="11" font-family="Arial,sans-serif">Eu inicial • Ativo</text><rect x="360" y="-160" width="280" height="169" rx="16" fill="#182337" stroke="#bca8ff" stroke-width="2"/><rect x="361" y="-159" width="278" height="7" rx="3" fill="#bca8ff"/><text x="375" y="-130" fill="#bca8ff" font-size="11" font-family="Arial,sans-serif" font-weight="bold">PREMISSA</text><text x="375" y="-108" fill="#f3f6fd" font-size="15" font-weight="bold" font-family="Arial,sans-serif">Sofrimento consciente</text><text x="375" y="-83" fill="#d8e0ef" font-size="13" font-family="Arial,sans-serif">Se desconheço um acontecimento, não</text><text x="375" y="-64" fill="#d8e0ef" font-size="13" font-family="Arial,sans-serif">posso sofrer conscientemente por ele</text><text x="375" y="-45" fill="#d8e0ef" font-size="13" font-family="Arial,sans-serif">naquele instante.</text><text x="375" y="-6" fill="#aabbd7" font-size="11" font-family="Arial,sans-serif">Eu inicial • Ativo</text><rect x="720" y="-210" width="280" height="169" rx="16" fill="#182337" stroke="#fa9b8c" stroke-width="2"/><rect x="721" y="-209" width="278" height="7" rx="3" fill="#fa9b8c"/><text x="735" y="-180" fill="#fa9b8c" font-size="11" font-family="Arial,sans-serif" font-weight="bold">OBJEÇÃO</text><text x="735" y="-158" fill="#f3f6fd" font-size="15" font-weight="bold" font-family="Arial,sans-serif">E as consequências?</text><text x="735" y="-133" fill="#d8e0ef" font-size="13" font-family="Arial,sans-serif">Não perceber algo elimina as</text><text x="735" y="-114" fill="#d8e0ef" font-size="13" font-family="Arial,sans-serif">consequências que isso pode produzir</text><text x="735" y="-95" fill="#d8e0ef" font-size="13" font-family="Arial,sans-serif">na minha vida?</text><text x="735" y="-56" fill="#aabbd7" font-size="11" font-family="Arial,sans-serif">Eu crítico • Ativo</text><rect x="1080" y="-230" width="280" height="169" rx="16" fill="#182337" stroke="#8dc9d2" stroke-width="2"/><rect x="1081" y="-229" width="278" height="7" rx="3" fill="#8dc9d2"/><text x="1095" y="-200" fill="#8dc9d2" font-size="11" font-family="Arial,sans-serif" font-weight="bold">CONTRA-ARGUMENTO</text><text x="1095" y="-178" fill="#f3f6fd" font-size="15" font-weight="bold" font-family="Arial,sans-serif">Duas dimensões</text><text x="1095" y="-153" fill="#d8e0ef" font-size="13" font-family="Arial,sans-serif">Ausência de sofrimento imediato não</text><text x="1095" y="-134" fill="#d8e0ef" font-size="13" font-family="Arial,sans-serif">significa ausência de efeitos</text><text x="1095" y="-115" fill="#d8e0ef" font-size="13" font-family="Arial,sans-serif">concretos.</text><text x="1095" y="-76" fill="#aabbd7" font-size="11" font-family="Arial,sans-serif">Eu inicial • Ativo</text><rect x="720" y="65" width="280" height="169" rx="16" fill="#182337" stroke="#ce9de6" stroke-width="2"/><rect x="721" y="66" width="278" height="7" rx="3" fill="#ce9de6"/><text x="735" y="95" fill="#ce9de6" font-size="11" font-family="Arial,sans-serif" font-weight="bold">CENÁRIO</text><text x="735" y="117" fill="#f3f6fd" font-size="15" font-weight="bold" font-family="Arial,sans-serif">Cenário A</text><text x="735" y="142" fill="#d8e0ef" font-size="13" font-family="Arial,sans-serif">Uma pessoa esconde um fato sem</text><text x="735" y="161" fill="#d8e0ef" font-size="13" font-family="Arial,sans-serif">alterar em nada minhas decisões ou</text><text x="735" y="180" fill="#d8e0ef" font-size="13" font-family="Arial,sans-serif">meu cotidiano.</text><text x="735" y="219" fill="#aabbd7" font-size="11" font-family="Arial,sans-serif">Eu inicial • Ativo</text><rect x="1080" y="85" width="280" height="150" rx="16" fill="#182337" stroke="#ce9de6" stroke-width="2"/><rect x="1081" y="86" width="278" height="7" rx="3" fill="#ce9de6"/><text x="1095" y="115" fill="#ce9de6" font-size="11" font-family="Arial,sans-serif" font-weight="bold">CENÁRIO</text><text x="1095" y="137" fill="#f3f6fd" font-size="15" font-weight="bold" font-family="Arial,sans-serif">Cenário B</text><text x="1095" y="162" fill="#d8e0ef" font-size="13" font-family="Arial,sans-serif">Uma informação omitida me impede de</text><text x="1095" y="181" fill="#d8e0ef" font-size="13" font-family="Arial,sans-serif">fazer escolhas importantes.</text><text x="1095" y="220" fill="#aabbd7" font-size="11" font-family="Arial,sans-serif">Eu crítico • Ativo</text><rect x="1440" y="-115" width="280" height="169" rx="16" fill="#182337" stroke="#70b9ff" stroke-width="2"/><rect x="1441" y="-114" width="278" height="7" rx="3" fill="#70b9ff"/><text x="1455" y="-85" fill="#70b9ff" font-size="11" font-family="Arial,sans-serif" font-weight="bold">PERGUNTA</text><text x="1455" y="-63" fill="#f3f6fd" font-size="15" font-weight="bold" font-family="Arial,sans-serif">O que é ser afetado?</text><text x="1455" y="-38" fill="#d8e0ef" font-size="13" font-family="Arial,sans-serif">Estou falando de sentir algo, de</text><text x="1455" y="-19" fill="#d8e0ef" font-size="13" font-family="Arial,sans-serif">perder autonomia ou de sofrer</text><text x="1455" y="0" fill="#d8e0ef" font-size="13" font-family="Arial,sans-serif">consequências?</text><text x="1455" y="39" fill="#aabbd7" font-size="11" font-family="Arial,sans-serif">Observador • Ativo</text><rect x="1440" y="180" width="280" height="150" rx="16" fill="#182337" stroke="#f1d07f" stroke-width="2"/><rect x="1441" y="181" width="278" height="7" rx="3" fill="#f1d07f"/><text x="1455" y="210" fill="#f1d07f" font-size="11" font-family="Arial,sans-serif" font-weight="bold">VALOR PESSOAL</text><text x="1455" y="232" fill="#f3f6fd" font-size="15" font-weight="bold" font-family="Arial,sans-serif">Autonomia</text><text x="1455" y="257" fill="#d8e0ef" font-size="13" font-family="Arial,sans-serif">Valorizar a possibilidade de escolher</text><text x="1455" y="276" fill="#d8e0ef" font-size="13" font-family="Arial,sans-serif">com base em informações relevantes.</text><text x="1455" y="315" fill="#aabbd7" font-size="11" font-family="Arial,sans-serif">Eu inicial • Ativo</text><rect x="1800" y="-35" width="280" height="169" rx="16" fill="#182337" stroke="#9eaff7" stroke-width="2"/><rect x="1801" y="-34" width="278" height="7" rx="3" fill="#9eaff7"/><text x="1815" y="-5" fill="#9eaff7" font-size="11" font-family="Arial,sans-serif" font-weight="bold">RETORNO AO TEMA</text><text x="1815" y="17" fill="#f3f6fd" font-size="15" font-weight="bold" font-family="Arial,sans-serif">Voltar ao centro</text><text x="1815" y="42" fill="#d8e0ef" font-size="13" font-family="Arial,sans-serif">Agora volto à pergunta original,</text><text x="1815" y="61" fill="#d8e0ef" font-size="13" font-family="Arial,sans-serif">distinguindo o que sinto do que</text><text x="1815" y="80" fill="#d8e0ef" font-size="13" font-family="Arial,sans-serif">realmente acontece.</text><text x="1815" y="119" fill="#aabbd7" font-size="11" font-family="Arial,sans-serif">Observador • Ativo</text><rect x="2160" y="-45" width="280" height="207" rx="16" fill="#182337" stroke="#d1b06e" stroke-width="2"/><rect x="2161" y="-44" width="278" height="7" rx="3" fill="#d1b06e"/><text x="2175" y="-15" fill="#d1b06e" font-size="11" font-family="Arial,sans-serif" font-weight="bold">CONCLUSÃO PROVISÓRIA</text><text x="2175" y="7" fill="#f3f6fd" font-size="15" font-weight="bold" font-family="Arial,sans-serif">Conclusão provisória</text><text x="2175" y="32" fill="#d8e0ef" font-size="13" font-family="Arial,sans-serif">Não saber pode impedir sofrimento</text><text x="2175" y="51" fill="#d8e0ef" font-size="13" font-family="Arial,sans-serif">consciente imediato, mas não garante</text><text x="2175" y="70" fill="#d8e0ef" font-size="13" font-family="Arial,sans-serif">ausência de consequências, nem</text><text x="2175" y="89" fill="#d8e0ef" font-size="13" font-family="Arial,sans-serif">preserva necessariamente minha</text><text x="2175" y="108" fill="#d8e0ef" font-size="13" font-family="Arial,sans-serif">autonomia.</text><text x="2175" y="147" fill="#aabbd7" font-size="11" font-family="Arial,sans-serif">Eu inicial • Ativo</text><rect x="325" y="420" width="280" height="169" rx="16" fill="#182337" stroke="#b5b2e9" stroke-width="2"/><rect x="326" y="421" width="278" height="7" rx="3" fill="#b5b2e9"/><text x="340" y="450" fill="#b5b2e9" font-size="11" font-family="Arial,sans-serif" font-weight="bold">ORGANIZAÇÃO / ROTEIRO</text><text x="340" y="472" fill="#f3f6fd" font-size="15" font-weight="bold" font-family="Arial,sans-serif">Organizando o exercício</text><text x="340" y="497" fill="#d8e0ef" font-size="13" font-family="Arial,sans-serif">Quero comparar o que sinto, o que</text><text x="340" y="516" fill="#d8e0ef" font-size="13" font-family="Arial,sans-serif">acontece e o que considero justo em</text><text x="340" y="535" fill="#d8e0ef" font-size="13" font-family="Arial,sans-serif">cada cenário.</text><text x="340" y="574" fill="#aabbd7" font-size="11" font-family="Arial,sans-serif">Observador • Ativo</text><rect x="700" y="440" width="280" height="169" rx="16" fill="#182337" stroke="#9eb6c8" stroke-width="2"/><rect x="701" y="441" width="278" height="7" rx="3" fill="#9eb6c8"/><text x="715" y="470" fill="#9eb6c8" font-size="11" font-family="Arial,sans-serif" font-weight="bold">COMENTÁRIO</text><text x="715" y="492" fill="#f3f6fd" font-size="15" font-weight="bold" font-family="Arial,sans-serif">Pensamento solto</text><text x="715" y="517" fill="#d8e0ef" font-size="13" font-family="Arial,sans-serif">Ainda não sei se este exemplo</text><text x="715" y="536" fill="#d8e0ef" font-size="13" font-family="Arial,sans-serif">realmente ajuda. Vou deixá-lo</text><text x="715" y="555" fill="#d8e0ef" font-size="13" font-family="Arial,sans-serif">registrado.</text><text x="715" y="594" fill="#aabbd7" font-size="11" font-family="Arial,sans-serif">Eu inicial • Ativo • 1 nota(s)</text><rect x="1090" y="460" width="280" height="169" rx="16" fill="#182337" stroke="#83c4ad" stroke-width="2"/><rect x="1091" y="461" width="278" height="7" rx="3" fill="#83c4ad"/><text x="1105" y="490" fill="#83c4ad" font-size="11" font-family="Arial,sans-serif" font-weight="bold">CONCORDÂNCIA PROVISÓRIA</text><text x="1105" y="512" fill="#f3f6fd" font-size="15" font-weight="bold" font-family="Arial,sans-serif">Aceito por enquanto</text><text x="1105" y="537" fill="#d8e0ef" font-size="13" font-family="Arial,sans-serif">Aceito temporariamente essa</text><text x="1105" y="556" fill="#d8e0ef" font-size="13" font-family="Arial,sans-serif">distinção, mas quero testá-la em</text><text x="1105" y="575" fill="#d8e0ef" font-size="13" font-family="Arial,sans-serif">outra situação.</text><text x="1105" y="614" fill="#aabbd7" font-size="11" font-family="Arial,sans-serif">Eu crítico • Ativo</text><rect x="1480" y="480" width="280" height="150" rx="16" fill="#182337" stroke="#9e9bcf" stroke-width="2"/><rect x="1481" y="481" width="278" height="7" rx="3" fill="#9e9bcf"/><text x="1495" y="510" fill="#9e9bcf" font-size="11" font-family="Arial,sans-serif" font-weight="bold">METACOMENTÁRIO</text><text x="1495" y="532" fill="#f3f6fd" font-size="15" font-weight="bold" font-family="Arial,sans-serif">Sobre o debate</text><text x="1495" y="557" fill="#d8e0ef" font-size="13" font-family="Arial,sans-serif">Não preciso transformar toda fala do</text><text x="1495" y="576" fill="#d8e0ef" font-size="13" font-family="Arial,sans-serif">meu diálogo interno em argumento.</text><text x="1495" y="615" fill="#aabbd7" font-size="11" font-family="Arial,sans-serif">Observador • Ativo</text><rect x="1860" y="450" width="280" height="169" rx="16" fill="#182337" stroke="#d9ac87" stroke-width="2"/><rect x="1861" y="451" width="278" height="7" rx="3" fill="#d9ac87"/><text x="1875" y="480" fill="#d9ac87" font-size="11" font-family="Arial,sans-serif" font-weight="bold">PAUSA / MARCADOR</text><text x="1875" y="502" fill="#f3f6fd" font-size="15" font-weight="bold" font-family="Arial,sans-serif">Retomar depois</text><text x="1875" y="527" fill="#d8e0ef" font-size="13" font-family="Arial,sans-serif">Na próxima sessão: investigar melhor</text><text x="1875" y="546" fill="#d8e0ef" font-size="13" font-family="Arial,sans-serif">a diferença entre dano e julgamento</text><text x="1875" y="565" fill="#d8e0ef" font-size="13" font-family="Arial,sans-serif">moral.</text><text x="1875" y="604" fill="#aabbd7" font-size="11" font-family="Arial,sans-serif">Observador • Ativo</text></svg>